services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        UID: ${UID}
        GID: ${GID}
    tty: true
    restart: "no"
    env_file: .env
    volumes:
      - ./src/app:/app/app
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    ports:
      - "${APP_PORT:-8000}:8000"
