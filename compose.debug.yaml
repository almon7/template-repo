services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
      target: debug
    tty: true
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    environment:
      - SAMPLE_ENV_VAR=${SAMPLE_ENV_VAR}
    ports:
      - "5678:5678"
    command: >
    i
      sh -c "
        pip install debugpy -t /tmp &&
        python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 app/main.py
      "