[project]
name = "template-app"
version = "0.0.1"
description = "template-app description"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
   "pydantic==2.12.3",
   "pydantic-settings==2.11.0",
   "loguru==0.7.3",
]


[dependency-groups]
dev = [
   "ruff==0.14.0",
   "mypy==1.18.2",
   "pytest==8.4.2",
   "pytest-cov==7.0.0",
   "bandit==1.8.6",
   "coverage==7.11.0",
]


# Declares the build backend so tools know how to build and install the package.
# Required for src/ layouts — without this, uv/pip fall back to legacy setuptools
# behaviour and may fail to find the package.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tells hatchling where the package source lives (required for src/ layout).
[tool.hatch.build.targets.wheel]
packages = ["src/app"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade — modernises syntax (e.g. Optional[x] -> x | None)
    "B",    # flake8-bugbear — catches common bugs (e.g. mutable default args)
    "C4",   # flake8-comprehensions — simplifies list/dict/set expressions
    "SIM",  # flake8-simplify — simplifies redundant patterns (e.g. `if x == True`)
    "N",    # pep8-naming — enforces CamelCase classes, snake_case functions
    "PT",   # flake8-pytest-style — enforces correct pytest idioms in tests
    "RUF",  # ruff-native rules not covered by the above
]

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"


[tool.mypy]
ignore_missing_imports = true # Suppresses errors for third-party packages that don't ship type stubs.
# Enables the full suite of strict checks: disallow_untyped_defs, warn_return_any,
# no_implicit_optional, strict_equality, and more. If mypy passes in strict mode, it
# genuinely is type-safe — default (non-strict) mode silently skips unannotated functions.
strict = true
# Required for Pydantic models — without this mypy misunderstands field access and
# raises false errors on every model attribute.
plugins = ["pydantic.mypy"]


[tool.bandit]
# B101: flags use of `assert`. Asserts are intentional in tests, so we skip this rule.
skips = ["B101"]
# Tests are not production code; scanning them produces noise without security value.
exclude_dirs = ["tests"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    # --cov value must match the installed package name (not a file path).
    "--cov=app",
    # Print uncovered line numbers directly in the terminal output.
    "--cov-report=term-missing",
    # Generate a browsable HTML coverage report in htmlcov/.
    "--cov-report=html:htmlcov",
    # Fail the test run if coverage drops below this threshold.
    "--cov-fail-under=80",
]


[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
