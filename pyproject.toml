[project]
name = "template-app"
version = "0.0.1"
description = "template-app description"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
   "pydantic==2.12.3",
   "pydantic-settings==2.11.0",
   "loguru==0.7.3",
]


[dependency-groups]
dev = [
   "ruff==0.14.0",
   "mypy==1.18.2",
   "pytest==8.4.2",
   "pytest-cov==7.0.0",
   "bandit==1.8.6",
   "coverage==7.11.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
]

[tool.ruff.format]
line-ending = "auto"
quote-style = "double"


[tool.mypy]
ignore_missing_imports = true
strict = true
plugins = ["pydantic.mypy"]


[tool.bandit]
skips = ["B101"]
exclude_dirs = ["tests"]
